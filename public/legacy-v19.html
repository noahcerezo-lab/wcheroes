in:12px auto 16px;flex-wrap:wrap}.mode-btn{font-family:inherit;background:#1c1831;color:#d7d0ef;border:2px solid #61537a;padding:12px 16px;cursor:pointer;font-weight:bold;letter-spacing:.06em}.mode-btn.active-mode{border-color:#ffcf69;color:#ffdc8c;background:#40304a;box-shadow:0 0 15px #e5a84b44}.mode-btn:hover{border-color:#ffdf96}

/* Responsive arcade + touch controller */
#mobile-controls{display:none;max-width:1440px;margin:8px auto 18px;padding:0 12px;box-sizing:border-box;align-items:center;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
#joystick{position:relative;width:148px;height:148px;flex:none;border:3px solid #b99164;border-radius:50%;background:radial-gradient(circle,#33294d,#181329);box-shadow:inset 0 0 20px #000a,0 4px 15px #0008;touch-action:none}
#joystick:before,#joystick:after{content:'';position:absolute;background:#ffffff22;pointer-events:none}#joystick:before{width:2px;height:112px;left:calc(50% - 1px);top:18px}#joystick:after{height:2px;width:112px;top:calc(50% - 1px);left:18px}
#stick{position:absolute;left:50%;top:50%;width:65px;height:65px;border:3px solid #ffe4a1;border-radius:50%;background:radial-gradient(circle at 30% 25%,#9173ad,#45305e 70%);box-shadow:0 3px 10px #000b;transform:translate(-50%,-50%);pointer-events:none}

#mobile-top{display:none;align-items:center;justify-content:space-between;max-width:1440px;margin:5px auto;padding:0 12px;box-sizing:border-box}#restart-touch{background:#2b2545;border:1px solid #b58a69;color:#ffe2a4;padding:8px 13px;border-radius:6px;font:bold 12px monospace}#mobile-tip{font-size:11px;color:#c7bedf}
@media (pointer:coarse),(max-width:700px){#mobile-controls{display:flex}#mobile-top{display:flex}body{overscroll-behavior:none}h1{font-size:21px;margin:9px 0 4px}.wrap>p:first-of-type{font-size:11px;margin:6px 8px}.mode-switch{margin:8px auto;gap:6px}.mode-btn{padding:9px;font-size:11px}#choices{margin:8px 10px 10px}.portrait{height:105px}canvas{width:calc(100vw - 12px);height:auto;max-width:1440px;border-width:2px}#status{font-size:11px;margin:6px 12px}}

let paused=false,boss=null,bossIntro=0,gameClock=0,combo=0,comboUntil=0;let player=null,enemies=[],particles=[],effects=[],keys={},score=0,kills=0,wave=1,last=0,spawn=0,gameOver=false,started=false,specialAt=0,attackAt=0,flash=0,healAt=0;

const WORLD_W=1440,WORLD_H=810;const bound=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function start(i){paused=false;boss=null;bossIntro=0;combo=0;comboUntil=0;document.getElementById('pause-touch').textContent='⏸ PAUSE';chosenHero=i;let h=heroes[i];player={...h,x:720,y:410,health:h.hp,facing:1};enemies=[];particles=[];effects=[];score=0;kills=0;wave=1;spawn=0;gameOver=false;started=true;specialAt=0;attackAt=0;healAt=performance.now();allies=squadMode?heroes.filter((_,j)=>j!==i).map((hero,j)=>({...hero,x:650+j*75,y:465+j*25,health:hero.hp,facing:1,attackAt:0,specialAt:0,healAt:performance.now(),hurt:0})):[];document.querySelectorAll('.hero-card').forEach((b,j)=>{b.classList.toggle('active',j===i);b.querySelector('.pick').textContent=j===i?'✓ FIGHTING':'▶ SELECT HERO'});status.textContent=(squadMode?'SQUAD MODE • 3 AI teammates • ':'SOLO MODE • ')+h.name+' — '+h.special+' | '+(h.name==='DESTINY'?'Passive healing aura: +3 HP every 1.5s':'Directional attacks: face your targets!')}
document.getElementById('soloMode').onclick=()=>{squadMode=false;document.getElementById('soloMode').classList.add('active-mode');document.getElementById('squadMode').classList.remove('active-mode');if(player)start(chosenHero)};

// Touch input uses the same keys as the keyboard, keeping all existing combat logic intact.
(function initMobileControls(){
 const joy=document.getElementById('joystick'),stick=document.getElementById('stick');let activePointer=null;
 function moveStick(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const radius=r.width*.32,dist=Math.hypot(dx,dy)||1;if(dist>radius){dx=dx/dist*radius;dy=dy/dist*radius}stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;const t=radius*.24;keys.a=dx < -t;keys.d=dx > t;keys.w=dy < -t;keys.s=dy > t}
 function resetJoy(){activePointer=null;stick.style.transform='translate(-50%,-50%)';keys.a=keys.d=keys.w=keys.s=false}
 joy.addEventListener('pointerdown',e=>{e.preventDefault();if(activePointer!==null)return;activePointer=e.pointerId;joy.setPointerCapture(e.pointerId);moveStick(e)});
 joy.addEventListener('pointermove',e=>{if(e.pointerId===activePointer){e.preventDefault();moveStick(e)}});
 for(const evt of ['pointerup','pointercancel','lostpointercapture'])joy.addEventListener(evt,e=>{if(e.pointerId===activePointer)resetJoy()});
 function bindButton(id,key){const b=document.getElementById(id);let pointer=null;b.addEventListener('pointerdown',e=>{e.preventDefault();if(pointer!==null)return;pointer=e.pointerId;b.setPointerCapture(e.pointerId);keys[key]=true;b.classList.add('pressed')});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,e=>{if(pointer===e.pointerId){pointer=null;keys[key]=false;b.classList.remove('pressed')}})}
 bindButton('attack-touch',' ');bindButton('special-touch','q');
 document.getElementById('restart-touch').addEventListener('click',()=>{if(player)start(chosenHero)});
 window.addEventListener('blur',()=>{resetJoy();keys[' ']=false;keys.q=false});
 document.addEventListener('touchmove',e=>{if(e.target.closest('#mobile-controls'))e.preventDefault()},{passive:false});
})();

function upgradeUnit(u){
 const tier=Math.floor(wave/10);
 if((u.upgradeTier||0)>=tier)return;
 const steps=tier-(u.upgradeTier||0);u.upgradeTier=tier;
 u.hp+=steps*(u.name==='MARKIE'?35:20);
 u.health=Math.min(u.hp,u.health+steps*35);
 u.damage=Math.round(u.damage*Math.pow(1.16,steps));
 u.range+=steps*(u.name==='ESPIRIT'?45:u.name==='NOAH'?20:10);
 u.cool=Math.max(110,u.cool*Math.pow(.94,steps));
 u.evolution=tier;
 if(u.name==='MARKIE'&&tier>=1)u.hp+=30*steps;
 if(u.name==='DESTINY'&&tier>=1)u.hp+=12*steps;
 if(u.name==='ESPIRIT'&&tier>=1)u.range+=55*steps;
 effects.push({kind:'levelup',x:u.x,y:u.y-30,t:0,life:60,color:u.color});
 burst(u.x,u.y-30,'#ffe68a',30);
}
function checkMilestone(){
 if(wave>1 && wave%10===0){
   for(const unit of [player,...allies])upgradeUnit(unit);
   status.textContent='LEVEL '+wave+' — HERO ASCENSION! Damage, range, health and attack speed upgraded.';
 }
}

const bossNames=['THE IRON TYRANT','THE ASH REAPER','THE VOID EMPEROR','THE DREAD COLOSSUS'];
function spawnBoss(){
 const stage=Math.floor(wave/15)-1;
 const hp=850+wave*75;
 boss={isBoss:true,name:bossNames[stage%bossNames.length],x:WORLD_W+85,y:WORLD_H*.5,hp,max:hp,
 speed:1.15+stage*.22,at:0,flash:0,hurt:0,stunUntil:0,kx:0,ky:0,floatT:0,
 facing:1,attackWindup:0,attackReady:0,attackType:0,stage};
 enemies=[];enemies.push(boss);bossIntro=120;spawn=0;
 effects.push({kind:'titan',x:480,y:280,t:0,life:50,color:'#ff697a'});
 status.textContent='⚠ BOSS LEVEL '+wave+' — '+boss.name+'! Defeat the boss to advance.';
}
function defeatBoss(e){
 combo=Math.min(20,combo+5);comboUntil=performance.now()+6000;score+=wave*250;kills+=1;burst(e.x,e.y-65,'#ffd47c',90);
 effects.push({kind:'celestial',x:e.x,y:e.y-60,t:0,life:65,color:'#ffe18a'});
 enemies=enemies.filter(v=>v!==e);boss=null;wave++;
 player.health=Math.min(player.hp,player.health+Math.round(player.hp*.35));
 for(const a of allies)if(a.health>0)a.health=Math.min(a.hp,a.health+Math.round(a.hp*.35));
 status.textContent='BOSS DEFEATED! +'+((wave-1)*250)+' score • Squad restored • LEVEL '+wave;
}
function bossAttack(e,now){
 const target=[player,...allies].filter(u=>u.health>0).sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y))[0];
 if(!target)return;
 if(!e.attackWindup&&now-e.at>2350){
  e.attackWindup=now+850;e.attackReady=now+850;
  e.attackType=(e.attackType+1)%2;
  effects.push({kind:'bossWarning',x:e.x,y:e.y,tx:target.x,ty:target.y,t:0,life:51,color:'#ff536d',type:e.attackType});
 }
 if(e.attackWindup&&now>=e.attackReady){
  e.attackWindup=0;e.at=now;
  const radius=e.attackType===0?145:105;
  const center=e.attackType===0?e:target;
  effects.push({kind:'bossImpact',x:center.x,y:center.y,t:0,life:25,color:'#ff9b56',radius});
  for(const u of [player,...allies])if(u.health>0&&Math.hypot(u.x-center.x,u.y-center.y)<radius){
    u.health-=now<(u.shieldUntil||0)?Math.round((20+wave)*.45):20+wave;
    u.hurt=18;burst(u.x,u.y-30,'#ff6574',15);
    if(u===player&&u.health<=0){gameOver=true;status.textContent='The boss defeated you. Press P to retry.'}
  }
 }
}
